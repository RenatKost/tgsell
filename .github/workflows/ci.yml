name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      # Pre-existing lint debt (400+ errors, mostly react/prop-types) predates
      # this workflow — surfaced but non-blocking until cleaned up separately,
      # otherwise every PR would fail on day one regardless of its own changes.
      - run: npm run lint
        continue-on-error: true
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tgsell
          POSTGRES_PASSWORD: tgsell
          POSTGRES_DB: tgsell
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://tgsell:tgsell@localhost:5432/tgsell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Compile-check all backend modules
        working-directory: backend
        run: python -m compileall -q app bot alembic
      - name: Migration cycle (upgrade -> downgrade -> upgrade)
        working-directory: backend
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head
