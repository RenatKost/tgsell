server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API proxy
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Blog + SEO: rendered by the backend (full HTML, real 404 for drafts/unknown slugs)
    location = /blog { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location ^~ /blog/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /robots.txt { proxy_pass http://backend:8000; }
    location = /sitemap.xml { proxy_pass http://backend:8000; }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Exact SPA routes → index.html
    location = / { try_files /index.html =404; }
    location = /sell { try_files /index.html =404; }
    location = /catalog { try_files /index.html =404; }
    location = /auction { try_files /index.html =404; }
    location = /cabinet { try_files /index.html =404; }
    location = /admin { try_files /index.html =404; }
    location = /sell-bundle { try_files /index.html =404; }
    location = /profile { try_files /index.html =404; }
    location = /privacy { try_files /index.html =404; }
    location = /oferta { try_files /index.html =404; }
    location = /faq { try_files /index.html =404; }
    location = /contacts { try_files /index.html =404; }
    location = /terms { try_files /index.html =404; }

    # Dynamic SPA prefixes
    location ^~ /channel/ { try_files /index.html =404; }
    location ^~ /bundle/ { try_files /index.html =404; }
    location ^~ /deal/ { try_files /index.html =404; }

    # Existing static files, else real HTTP 404
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 =404 /404.html;

    location = /404.html {
        internal;
    }
}
